<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920,initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Legacy — Lower Third</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet"/>
<style>
  /* Lower third for Wirecast: Network -> New Web Page, then tick
     "Transparent Background" on the source. Nothing here paints a page
     background, so Wirecast keys straight over the program feed.
     Designed to sit on screen for the rest of the service, so it is deliberately
     quiet: no full-screen takeover, no motion beyond the number counting. */
  :root{ --accent:#c9a96e; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:transparent;overflow:hidden;}
  body{font-family:'Montserrat',system-ui,-apple-system,sans-serif;color:#fff;
       margin:0;position:relative;}

  /* same fixed-stage trick as the projector page: 1920x1080 scaled to fit,
     so the layout holds whatever size Wirecast renders the source at */
  .stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;
         transform-origin:50% 50%;}

  .lower{
    position:absolute;left:80px;bottom:80px;width:1320px;
    background:rgba(8,8,8,.82);
    border-radius:20px;
    border-left:10px solid var(--accent);
    padding:26px 34px;
    display:flex;align-items:center;gap:34px;
    transition:border-color .8s ease, background .8s ease;
  }

  .lt-main{flex:1;min-width:0;}
  .lt-eyebrow{font-size:23px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
              color:rgba(255,255,255,.7);}
  .lt-total{font-size:88px;font-weight:900;letter-spacing:-.035em;line-height:1;
            margin-top:6px;color:var(--accent);font-variant-numeric:tabular-nums;
            transition:color .8s ease;}
  .lt-bar{margin-top:16px;height:14px;border-radius:99px;background:rgba(255,255,255,.18);
          overflow:hidden;}
  .lt-fill{height:100%;width:0;border-radius:99px;background:var(--accent);
           transition:width 1.4s cubic-bezier(.22,1,.36,1), background .8s ease;}
  .lt-meta{margin-top:13px;font-size:30px;font-weight:700;letter-spacing:.02em;
           color:rgba(255,255,255,.9);}
  .lt-meta b{font-weight:900;color:#fff;}

  /* milestone: a brief highlight in place of the stats line, never a takeover */
  .lt-meta.flash{color:#fff;font-weight:900;}
  .lower.flash{background:rgba(8,8,8,.92);}

  .lt-right{display:flex;align-items:center;gap:22px;flex-shrink:0;}
  .lt-qr{background:#fff;border-radius:12px;padding:8px;width:124px;height:124px;}
  .lt-qr svg{display:block;width:100%;height:auto;}
  .lt-links{text-align:left;}
  .lt-url{font-size:26px;font-weight:800;letter-spacing:.01em;color:#fff;white-space:nowrap;}
  .lt-codewrap{margin-top:10px;}
  .lt-codewrap[hidden]{display:none;}
  .lt-cl{font-size:18px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;
         color:rgba(255,255,255,.6);}
  .lt-cv{font-size:40px;font-weight:900;letter-spacing:.04em;line-height:1.05;
         color:var(--accent);transition:color .8s ease;}
</style>
</head>
<body>

        <div class="lt-url">gbfpc.org/legacy</div>
        <div class="lt-codewrap" id="codeWrap" hidden>

  </div>
</div>

<script>
(function(){
  function qp(k,d){ var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);
                    return m?decodeURIComponent(m[1]):d; }
  var POLL_MS   = parseInt(qp('poll','2000'),10) || 2000;
  var FLASH_MS  = parseInt(qp('flash','7000'),10) || 7000;
  var DKEY      = qp('key','');
  var CODE      = qp('code','');
  var SHOW_QR   = qp('qr','1') !== '0';
  if (!SHOW_QR) document.querySelector('.lt-qr').style.display = 'none';

  var SUPABASE_URL='https://keuecvwaailuvouwegod.supabase.co';
  var ANON_KEY='sb_publishable_LRE10Uf2omW1sP2qqKsbEQ_gvPLaKVC';
  var H={'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY};

  var stage=document.getElementById('stage');
  function fitStage(){
    var s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    stage.style.transform='translate(-50%,-50%) scale('+s+')';
  }
  fitStage();
  window.addEventListener('resize', fitStage);

  function usd0(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
  /* rAF is suspended whenever the page is not visible - Wirecast may well
     render this offscreen - so the final value is always written on a timer. */
  function animateNumber(el,from,to,ms){
    if(document.hidden){ el.textContent=usd0(to); return; }
    var t0=(window.performance&&performance.now)?performance.now():Date.now();
    function step(){
      var now=(window.performance&&performance.now)?performance.now():Date.now();
      var p=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-p,3);
      el.textContent=usd0(from+(to-from)*e);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    setTimeout(function(){ el.textContent=usd0(to); }, ms+150);
  }

  var elTotal=document.getElementById('total'), elFill=document.getElementById('fill'),
      elMeta=document.getElementById('meta'), lower=document.getElementById('lower');
  var prev=0, first=true, lastMs=null, flashTimer=null;

  function statsLine(count,goal,total,next){
    var bits=[];
    bits.push('<b>'+count.toLocaleString('en-US')+'</b> '+(count===1?'family':'families'));
    if(next) bits.push('next <b>'+usd0(Number(next.amount))+'</b>');
    else if(goal>0) bits.push('<b>goal reached</b>');
    if(goal>0) bits.push('goal '+usd0(goal));
    return bits.join(' &nbsp;·&nbsp; ');
  }

  function render(s){
    if(!s) return;
    var total=Number(s.total_pledged||0), goal=Number(s.goal||0), count=Number(s.pledge_count||0);
    var accent=(s.current_milestone&&s.current_milestone.color)||'#c9a96e';
    document.documentElement.style.setProperty('--accent',accent);

    animateNumber(elTotal, first?0:prev, total, 1300);
    if(goal>0) elFill.style.width=Math.min(100,total/goal*100)+'%';
    document.getElementById('eyebrow').textContent=(s.campaign||'Legacy')+' Offering';

    var cm=s.current_milestone, key=cm?String(cm.amount):null;
    var inFlash = flashTimer !== null;
    if(key && key!==lastMs && !first){
      elMeta.innerHTML = (cm.label? cm.label+' &nbsp;·&nbsp; ':'') + (cm.message||'');
      elMeta.classList.add('flash'); lower.classList.add('flash');
      if(flashTimer) clearTimeout(flashTimer);
      flashTimer=setTimeout(function(){
        elMeta.classList.remove('flash'); lower.classList.remove('flash');
        flashTimer=null;
        elMeta.innerHTML=statsLine(count,goal,total,s.next_milestone);
      }, FLASH_MS);
    } else if(!inFlash){
      elMeta.innerHTML=statsLine(count,goal,total,s.next_milestone);
    }
    lastMs=key; prev=total; first=false;
  }

  function tick(){
    fetch(SUPABASE_URL+'/rest/v1/rpc/legacy_public_totals',{method:'POST',headers:H,body:'{}'})
      .then(function(r){ return r.json(); }).then(render)
      .catch(function(){ /* keep last good values on screen */ });
  }
  tick(); setInterval(tick, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });

  function showCode(v){
    if(!v){ document.getElementById('codeWrap').hidden=true; return; }
    document.getElementById('codeVal').textContent=v;
    document.getElementById('codeWrap').hidden=false;
  }
  if(CODE){ showCode(CODE); }
  else if(DKEY){
    var pollCode=function(){
      fetch(SUPABASE_URL+'/rest/v1/rpc/legacy_display_info',{method:'POST',headers:H,
            body:JSON.stringify({p_key:DKEY})})
        .then(function(r){ return r.json(); })
        .then(function(d){ showCode(d && d.service_code); })
        .catch(function(){});
    };
    pollCode(); setInterval(pollCode, 15000);
  }
}());
</script>
</body>
</html>
